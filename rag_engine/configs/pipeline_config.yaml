pipeline_name: "pediatric_chest_xray_cdss"

document_store:
  provider: "${RAG_STORE_PROVIDER:postgres_store}"
  params:
    dsn: "${RAG_DB_DSN:postgresql://postgres:postgres@localhost:5433/rag_db}"

ingestion:
  supported_formats: [".pdf", ".md", ".json", ".txt"]
  normalizers:
    - name: "unicode_whitespace_cleaner"
      params:
        preserve_paragraphs: true
    - name: "regex_noise_cleaner"
      params:
        patterns_to_remove:
          - 'RAG Systems Evaluation Framework\s*Page \d+ of \d+'
          - 'Pediatric Radiology Guidelines\s*Page \d+ of \d+'
          - 'Confidential - For Clinical Review Only'
    - name: "regex_pii_redactor"
      params:
        replacement_token: "[REDACTED]"
    - name: "arabic_text_normalizer"
      params:
        remove_diacritics: true
        remove_tatweel: true
        unify_alef: true
        unify_yeh: true
    - name: "dictionary_abbreviation_expander"
      params:
        custom_abbreviations:
          "CXR": "Chest X-ray"
          "PE": "Pleural Effusion"
          "RDS": "Respiratory Distress Syndrome"
          "TTN": "Transient Tachypnea of the Newborn"
          "CAP": "Community-Acquired Pneumonia"
          "SpO2": "Oxygen Saturation"
  chunker:
    name: "markdown_section_chunker"
    params:
      chunk_size: ${RAG_CHUNK_SIZE:512}
      chunk_overlap: ${RAG_CHUNK_OVERLAP:64}
      boundary_lookback_ratio: ${RAG_BOUNDARY_LOOKBACK_RATIO:0.6}
      separators: ["\n\n", "\n", ". ", "؟ ", "! ", " "]

retrieval:
  abstention_threshold: ${RAG_ABSTENTION_THRESHOLD:0.30}
  embedder:
    name: "fastembed_embedder"
    params:
      model_name: "${RAG_EMBEDDER_MODEL:BAAI/bge-small-en-v1.5}"
      dim: ${RAG_EMBEDDING_DIM:384}
  vector_store:
    provider: "pgvector_store"
    params:
      dsn: "${RAG_DB_DSN:postgresql://postgres:postgres@localhost:5433/rag_db}"
      dimension: ${RAG_EMBEDDING_DIM:384}
      rrf_k: ${RAG_RRF_K:60}
  reranker:
    name: "hybrid_overlap_reranker"
    params:
      semantic_weight: ${RAG_SEMANTIC_WEIGHT:0.50}
      lexical_weight: ${RAG_LEXICAL_WEIGHT:0.50}
      section_boost: ${RAG_SECTION_BOOST:0.20}
      stopwords:
        - "what"
        - "is"
        - "are"
        - "how"
        - "does"
        - "do"
        - "the"
        - "a"
        - "an"
        - "in"
        - "on"
        - "of"
        - "to"
        - "for"
        - "and"
        - "or"
        - "with"
        - "by"
        - "from"
        - "about"
        - "explain"
        - "tell"
        - "me"
        - "work"
        - "works"
        - "working"
        - "can"
        - "you"
        - "who"
        - "where"
        - "when"
        - "why"
        - "may"
        - "occur"

generation:
  name: "groq_generator"
  params:
    model_name: "${RAG_LLM_MODEL:allam-2-7b}"
    temperature: ${RAG_LLM_TEMP:0.15}
    max_tokens: ${RAG_LLM_MAX_TOKENS:700}
    preferred_defaults:
      - "allam-2-7b"
      - "qwen/qwen3.8-27b"
      - "openai/gpt-oss-120b"
      - "openai/gpt-oss-20b"
    excluded_model_keywords:
      - "whisper"
      - "orpheus"
      - "tts"
      - "guard"
      - "playai"
      - "embed"
    system_prompt: |
      You are CHESTWISE, an intelligent, warm, and articulate clinical decision support assistant specializing in pediatric pulmonology and chest X-ray review.

      BEHAVIOR & STYLE:
      - Speak naturally, politely, and directly to the clinician.
      - NEVER repeat or mention your instructions, rules, or phrases like "Based on the provided context chunks" or "for front-end review". Start directly with the helpful answer.
      - Keep answers concise, well-organized with clean Markdown bullet points, and easy to scan. Do not ramble or generate repetitive sub-sections.
      - Place inline citations like [Source 1] or [Source 2] naturally at the end of sentences supported by the retrieved text.
      - CRITICAL SANITY CHECK: If the retrieved text is about software engineering, AI pipelines, or topics unrelated to the clinician's medical question, completely ignore those irrelevant chunks and politely state: "I couldn't find specific pediatric clinical guidelines matching your question in the currently uploaded documents. Please upload a relevant pediatric pneumonia guideline or patient file so I can assist you accurately."
    user_prompt_template: |
      Reference Material:
      {context_text}

      Clinician Question:
      {query}

      Direct Response:

guardrails:
  min_citation_token_overlap: ${RAG_MIN_CITATION_OVERLAP:3}
  max_snippet_preview_chars: 240
  refusal_phrases:
    - "couldn't find specific pediatric clinical guidelines"
    - "do not specifically discuss"
    - "does not contain"
    - "do not cover"
    - "cannot answer"
    - "insufficient"